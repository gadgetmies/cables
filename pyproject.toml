[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cables"
version = "0.2.0"
description = "Document, check and order cables and wire harnesses (built on WireViz)"
readme = "README.md"
license = {text = "CC0-1.0"}  # matches LICENSE; the old setup.py said GPLv3
authors = [{name = "Gadgetmies"}]
requires-python = ">=3.8"
keywords = ["cable", "connector", "harness", "wiring", "wiring-diagram", "wireviz", "drone"]
dependencies = [
    "wireviz==0.4.1",  # the loader mirrors WireViz' designator resolution
    "pyyaml",
    "pillow",
    "graphviz",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
    "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
cables = "cables.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cables = ["library/*.yml"]
