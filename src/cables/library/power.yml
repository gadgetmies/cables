library: power
description: Solder-cup battery and power connectors (Amass XT series).
source: Amass XT series product pages. Wire ranges are common practice for the solder cups, not a datasheet limit; test-fit before ordering.

connectors:
  xt: &xt
    manufacturer: Amass
    pincount: 2
    pinlabels: ["+", "-"]
    subtype: solder cup

  xt30_male:
    <<: *xt
    type: XT30 male (plug pins)
    mpn: XT30U-M
    wire_awg: [20, 16]
  xt30_female:
    <<: *xt
    type: XT30 female (sockets)
    mpn: XT30U-F
    wire_awg: [20, 16]

  xt60_male:
    <<: *xt
    type: XT60 male (plug pins)
    mpn: XT60H-M
    wire_awg: [14, 12]
  xt60_female:
    <<: *xt
    type: XT60 female (sockets)
    mpn: XT60H-F
    wire_awg: [14, 12]

  xt90_male:
    <<: *xt
    type: XT90 male (plug pins)
    mpn: XT90H-M
    wire_awg: [10, 8]
  xt90_female:
    <<: *xt
    type: XT90 female (sockets)
    mpn: XT90H-F
    wire_awg: [10, 8]
