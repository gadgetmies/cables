library: jst
description: JST wire-to-board crimp housings commonly used on drones and flight controllers.
source: JST GH and SH series catalogues (housing GHR-nnV-S / SHR-nnV-S-B, see jst-mfg.com); verify contact AWG range against the current datasheet.

connectors:
  gh: &gh
    type: JST GH
    subtype: 1.25 mm pitch, female housing
    manufacturer: JST
    wire_awg: [30, 26]  # SSHL-002T-P0.2 contact
    additional_components:
      - type: Crimp contact, JST GH
        manufacturer: JST
        mpn: SSHL-002T-P0.2
        qty_multiplier: populated
  sh: &sh
    type: JST SH
    subtype: 1.0 mm pitch, female housing
    manufacturer: JST
    wire_awg: [32, 28]  # SSH-003T-P0.2-H contact
    additional_components:
      - type: Crimp contact, JST SH
        manufacturer: JST
        mpn: SSH-003T-P0.2-H
        qty_multiplier: populated
  gh2:
